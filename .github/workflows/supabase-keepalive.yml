          SUPABASE_URL: https://hnqlijktszjysdnnhwun.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhucWxpamt0c3pqeXNkbm5od3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzk4NjUsImV4cCI6MjEwNzY1NTg2NX0.N5xhWOlB0FN21SM8JftZU8q_sH2iAnxQ-Z5lpPgEx2g
